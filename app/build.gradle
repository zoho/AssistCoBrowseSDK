apply plugin: 'com.android.application'

apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdkVersion "android-37.0"
    namespace = "com.zoho.assist.cobrowse.demo"
    defaultConfig {
        applicationId = "com.zoho.assist.cobrowse.demo"
        minSdk = 23
        targetSdk = 37
        versionCode = 1
        versionName = "1.0.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        buildConfigField 'int', 'VERSION_CODE', "${versionCode}"
        buildConfigField 'String', 'VERSION_NAME', "\"${versionName}\""
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig = true
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
configurations {
    cleanedAnnotations
    implementation.exclude group: 'org.jetbrains' , module:'annotations'
    // org.json:json duplicates classes Android ships in the platform.
    configureEach {
        exclude group: 'org.json', module: 'json'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${rootProject.ext.kotlin_version}"
    implementation 'androidx.core:core-ktx:1.19.1'          // SDK floor
    implementation 'androidx.appcompat:appcompat:1.8.0'     // SDK floor
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2' // SDK floor
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    // "SDK floor" versions match what the CoBrowse SDK declares. Lowering one
    // fails at runtime with NoSuchMethodError, not at build time.
    testImplementation 'junit:junit:4.13.2'

    // --- Compose ---
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'   // SDK floor
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'

    // --- CoBrowse SDK ---
    api 'com.zoho.assist:cobrowse:1.0.0'
}
